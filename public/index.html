<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>UtiliDados</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

        <link rel="stylesheet" href="https://satccet.uniriotec.br/ccet/barrasccet.css" media="screen">

        <script defer="defer" src="https://satccet.uniriotec.br/ccet/barrasccet.js" type="text/javascript"></script>

        <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

        <style>
            #grafos {
                height: 640px;
            }
        </style>
    </head>
    <body>
        <section class="py-3">
            <div class="container">
                <form class="js-filtros">
                    <div class="row">
                        <div class="col">
                            <select name="" id="" class="form-select" data-filtro="instituicoes">
                                <option value="">Instituições</option>
                            </select>
                        </div>
                        <div class="col">
                            <select name="" id="" class="form-select" data-filtro="orientadores">
                                <option value="">Orientadores</option>
                            </select>
                        </div>
                        <div class="col">
                            <button type="button" class="btn btn-primary w-100">Filtrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="py-3">
            <div class="container">
                <div class="card">
                    <div class="card-body p-0">
                        <div id="grafos"></div>
                    </div>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <script src="./script.js"></script>
    </body>
</html>
